# CARF Configuration (Change-Aware Rollback Framework)
version: "1.0"
mode: balanced
thresholds:
  base_tolerance_pct: 0.5
  max_tolerance_pct: 3.5
  observation_window_seconds: 180
rules:
  - name: test-discount
    pattern: "**/*.{test,spec}.*"
    weight: 0.1
  - name: config-and-manifests
    pattern: "**/*.{yaml,yml,json,env}"
    weight: 1.2
  - name: db-migrations
    pattern: "**/migrations/**"
    weight: 2.5
