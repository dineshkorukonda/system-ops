version: '3.8'

services:
  system-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: system-ops:latest
    container_name: system-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    env_file:
      - .env.docker
    environment:
      PORT: "9080"
      HOST: "0.0.0.0"
      NODE_ENV: production
      APP_PASSWORD: ${APP_PASSWORD:-change_me_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-random_secret_token_ops_2026}
      SYSTEMD_UNITS: ${SYSTEMD_UNITS:-nginx,ollama,postgresql}
      DISK_PATHS: ${DISK_PATHS:-/,/var}
      TLS_HOSTS: ${TLS_HOSTS:-}
      TRACKED_DOMAINS: ${TRACKED_DOMAINS:-}
      NGINX_LOG_PATH: ${NGINX_LOG_PATH:-/var/log/nginx/access.log}
      LOG_SOURCES: ${LOG_SOURCES:-}
      BACKUPS_DIR: ${BACKUPS_DIR:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_SERVICE_NAME: ${OLLAMA_SERVICE_NAME:-ollama}
      ENABLE_GO_COLLECTOR: ${ENABLE_GO_COLLECTOR:-false}
      ENABLE_SYSTEM_COLLECTOR: ${ENABLE_SYSTEM_COLLECTOR:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log:/var/log/host:ro
      # Mount backup dumps only when BACKUPS_DIR is set, e.g. /var/backups/postgres:/var/backups/postgres:ro

      # SECURITY WARNING — Docker socket gives root-equivalent host access.
      # Uncomment only if you need the Docker page to list host containers:
      # - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
