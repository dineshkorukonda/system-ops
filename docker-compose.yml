services:
  system-ops:
    build:
      context: .
      dockerfile: Dockerfile
    image: system-ops:latest
    container_name: system-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    env_file:
      - .env.docker
    environment:
      PORT: "9080"
      HOST: "0.0.0.0"
      NODE_ENV: production
      ENABLE_GO_COLLECTOR: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - system-ops-data:/app/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log:/var/log/host:ro
      # Mount backup dumps only when BACKUPS_DIR is set, e.g. /var/backups/postgres:/var/backups/postgres:ro

      # SECURITY WARNING — Docker socket gives root-equivalent host access.
      # Uncomment only if you need the Docker page to list host containers:
      # - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  system-ops-data:
