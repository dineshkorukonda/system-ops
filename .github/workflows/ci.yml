name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      - name: Check collector boundary types
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Smoke-test production startup and authentication
        run: npm run test:smoke

      - name: Record short Linux resource baseline
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SECONDS: '10'
          BASELINE_WARMUP_SECONDS: '5'

      - uses: actions/upload-artifact@v4
        with:
          name: resource-baseline
          path: artifacts/resource-baseline.json

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and smoke-test the production image
        run: bash scripts/docker-smoke.sh

  traffic-comparison:
    if: github.head_ref == 'fix/traffic-bounds' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare reference and current defaults on the same machine
        run: bash scripts/compare-resources.sh
        env:
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '5'
          BASELINE_SCENARIOS: idle,traffic,rotation
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-comparison
          path: artifacts/comparison/

  collector-comparison:
    if: github.head_ref == 'fix/collector-ownership' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-collector/go.mod
      - run: npm ci && npm run build
      - run: mkdir -p bin && go build -o bin/system-ops-collector .
        working-directory: go-collector
      - name: Measure Node-only collection
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SCENARIOS: idle,viewers
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '10'
          BASELINE_OUTPUT: artifacts/collectors/node.json
      - name: Measure Node plus Go collection
        run: node scripts/resource-baseline.js
        env:
          BASELINE_COLLECTOR: go
          BASELINE_SCENARIOS: idle,viewers
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '10'
          BASELINE_OUTPUT: artifacts/collectors/go.json
      - uses: actions/upload-artifact@v4
        with:
          name: collector-comparison
          path: artifacts/collectors/
