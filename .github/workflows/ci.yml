name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Smoke-test production startup and authentication
        run: npm run test:smoke

      - name: Record short Linux resource baseline
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SECONDS: '10'
          BASELINE_WARMUP_SECONDS: '5'

      - uses: actions/upload-artifact@v4
        with:
          name: resource-baseline
          path: artifacts/resource-baseline.json

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and smoke-test the production image
        run: bash scripts/docker-smoke.sh
