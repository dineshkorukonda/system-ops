name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      - name: Check collector boundary types
        run: npm run typecheck
      - name: Build and validate public documentation
        run: npm run docs:build && npm run docs:check
      - name: Record dependency licenses
        run: npm run licenses:report
      - name: Audit dependency advisories
        run: npm audit --audit-level=moderate

      - name: Build frontend
        run: npm run build

      - name: Smoke-test production startup and authentication
        run: npm run test:smoke

      - name: Record short Linux resource baseline
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SECONDS: '10'
          BASELINE_WARMUP_SECONDS: '5'

      - uses: actions/upload-artifact@v4
        with:
          name: resource-baseline
          path: artifacts/resource-baseline.json

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and smoke-test the production image
        run: bash scripts/docker-smoke.sh

  traffic-comparison:
    if: github.head_ref == 'fix/traffic-bounds' || github.head_ref == 'fix/consolidated-main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare reference and current defaults on the same machine
        run: bash scripts/compare-resources.sh
        env:
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '5'
          BASELINE_SCENARIOS: idle,traffic,rotation
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-comparison
          path: artifacts/comparison/

  collector-comparison:
    if: github.head_ref == 'fix/collector-ownership' || github.head_ref == 'fix/consolidated-main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-collector/go.mod
      - run: npm ci && npm run build
      - run: mkdir -p bin && go build -o bin/system-ops-collector .
        working-directory: go-collector
      - name: Measure Node-only collection
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SCENARIOS: idle,viewers
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '10'
          BASELINE_OUTPUT: artifacts/collectors/node.json
      - name: Measure Node plus Go collection
        run: node scripts/resource-baseline.js
        env:
          BASELINE_COLLECTOR: go
          BASELINE_SCENARIOS: idle,viewers
          BASELINE_SECONDS: '20'
          BASELINE_WARMUP_SECONDS: '10'
          BASELINE_OUTPUT: artifacts/collectors/go.json
      - uses: actions/upload-artifact@v4
        with:
          name: collector-comparison
          path: artifacts/collectors/

  pm2-fixture:
    if: github.head_ref == 'fix/pm2-discovery' || github.head_ref == 'fix/consolidated-main' || github.head_ref == 'fix/discovery-ui' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate real multi-user PM2 monitoring
        run: bash scripts/pm2-fixture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pm2-fixture
          path: artifacts/pm2-fixture.json

  browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regressions
          path: |
            playwright-report/
            test-results/
            artifacts/ui/

  adapter-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/adapter-fixture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-fixtures
          path: artifacts/adapter-fixture.json

  observability-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: node scripts/observability-fixture.js
      - uses: actions/upload-artifact@v4
        with:
          name: observability-fixture
          path: artifacts/observability-fixture.json

  release-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: node scripts/release-fixture.js
      - uses: actions/upload-artifact@v4
        with:
          name: release-fixture
          path: artifacts/release-fixture.json

  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build && npm run docs:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site
          path: |
            artifacts/site/
            artifacts/site-report/
            test-results/

  native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual installer, account, sudoers, systemd updater, and rollback
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/native-release-fixture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-release
          path: |
            artifacts/native-release-fixture.json
            artifacts/native-install.log
            artifacts/native-update.log
