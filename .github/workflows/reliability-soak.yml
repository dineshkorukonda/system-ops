name: Reference-host reliability soak
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    # Requires an operator-provisioned disposable host; never run PR code here.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, system-ops-reference]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference environment
        run: |
          node -e 'if(!process.version.startsWith("v24."))throw new Error("Use Node 24")'
          test "$(. /etc/os-release && echo "$ID")" = ubuntu
          ! uname -r | grep -qi microsoft
      - run: npm ci
      - run: npm run build
      - name: Measure a real 24-hour workload
        run: node scripts/resource-baseline.js
        env:
          BASELINE_SCENARIOS: traffic
          BASELINE_SECONDS: '86400'
          BASELINE_WARMUP_SECONDS: '20'
          BASELINE_LOG_MAX_BYTES: '67108864'
          BASELINE_OUTPUT: artifacts/reference-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-soak
          path: artifacts/reference-soak.json
          if-no-files-found: warn
