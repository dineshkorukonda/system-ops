name: Independent observer segment
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      segment:
        required: true
        type: number
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: mkdir -p artifacts
      - name: Observe from a host independent of the reference workload
        env:
          TARGET_URL: ${{ inputs.target }}
          PROBE_INTERVAL_MS: '60000'
          PROBE_SECONDS: '18000'
        run: node scripts/external-observer.js "$TARGET_URL" artifacts/observer.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-observer-${{ inputs.segment }}
          path: artifacts/observer.jsonl
          if-no-files-found: error
