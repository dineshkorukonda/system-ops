name: Bug report
description: Report a reproducible problem in System Ops.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Remove passwords, tokens, visitor IPs, and private data. Never upload your .env or monitoring database. Use private reporting for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Installation method
      options: [Native Ubuntu/systemd, Docker Compose, Development checkout, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: Ubuntu version, node --version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant configuration names and the affected integration, without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or screenshots
      description: Include errors and relevant logs after removing private data.
