<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login // monarx ollama ops</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-title">monarx // ollama ops login</div>
      <form id="loginForm" class="login-form">
        <div>
          <label style="display: block; color: var(--text-dim); margin-bottom: 0.35rem;">Password:</label>
          <input type="password" id="password" class="input-min" style="width: 100%;" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="loginError" class="login-err hidden">Invalid password</div>
        <button type="submit" id="loginBtn" class="btn-min btn-accent" style="width: 100%;">Login</button>
      </form>
      <div style="font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 0.5rem;">
        Target: 127.0.0.1:9080 (Loopback protected)
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    fetch('/api/auth/status')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) window.location.href = '/';
      })
      .catch(() => {});

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          loginError.textContent = data.error || 'Invalid password';
          loginError.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (err) {
        loginError.textContent = 'Connection error';
        loginError.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
