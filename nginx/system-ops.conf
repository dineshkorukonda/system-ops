# Nginx Server Block for System Ops Mini-Site
# Location: /etc/nginx/sites-available/system-ops.conf
# Enable via: sudo ln -s /etc/nginx/sites-available/system-ops.conf /etc/nginx/sites-enabled/

# Rate Limiting Zone Definition (10 requests/sec per IP)
limit_req_zone $binary_remote_addr zone=ops_limit:10m rate=10r/s;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name ops.example.com; # Replace with your subdomain (e.g. system-ops.yourdomain.com)

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.example.com; # Replace with your subdomain

    # SSL Certificates managed by Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;

    # OPTIONAL SECURITY: IP Allowlist (Uncomment lines below to restrict access to specific trusted IPs)
    # allow 203.0.113.5; # Office IP
    # allow 198.51.100.22; # Home IP
    # deny all;

    # OPTIONAL SECURITY: Nginx HTTP Basic Authentication
    # Create password file with: sudo htpasswd -c /etc/nginx/.htpasswd opsadmin
    # auth_basic "System Ops Protected Console";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Public Health Endpoint (Bypasses Auth if Nginx Basic Auth is enabled)
    location /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:9080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Main Reverse Proxy to System Ops Backend (App handles its own auth cookie + password)
    location / {
        limit_req zone=ops_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming chat probe tests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
